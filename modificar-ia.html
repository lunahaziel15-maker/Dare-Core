  <section id="darecoreAiKnowledgeAdmin">
    <div class="dc-ai-head">
      <h2 class="dc-ai-heading">DARECORE INTELLIGENCE â€¢ INFORMACIÃ“N PARA LA IA</h2>
      <span class="dc-ai-status" id="darecoreAiKbStatus">Listo</span>
    </div>
    <p class="dc-ai-desc">Escribe aquÃ­ la descripciÃ³n de Dare Core, tallas, envÃ­os, tiempos, formas de pago y reglas de personalizaciÃ³n. La IA usarÃ¡ este texto para responder.</p>
    <textarea id="darecoreAiKbTextarea" rows="10"></textarea>
    <div class="dc-ai-actions">
      <button type="button" id="saveDarecoreAiKbBtn">Guardar informaciÃ³n de la IA</button>
      <button type="button" id="resetDarecoreAiKbBtn">Restaurar texto base</button>
    </div>
  </section>

  <script>
    (function () {
      const STORAGE_KEY = "darecore_ai_knowledge";
      const DEFAULT_TEXT = "Dare Core es una marca local en LeÃ³n, Guanajuato, dedicada a la creaciÃ³n y venta de ropa urbana y playeras personalizadas 100 % de algodÃ³n.\n\nLo que ofrecen:\n- Prendas bÃ¡sicas y estilo urbano: fabrican playeras (incluyendo cortes oversize y sin mangas) elaboradas en algodÃ³n suave.\n- PersonalizaciÃ³n completa: estampan diseÃ±os exclusivos, frases o detalles a peticiÃ³n del cliente.";

      const textarea = document.getElementById("darecoreAiKbTextarea");
      const saveBtn = document.getElementById("saveDarecoreAiKbBtn");
      const resetBtn = document.getElementById("resetDarecoreAiKbBtn");
      const statusEl = document.getElementById("darecoreAiKbStatus");
      const logoutBtn = document.getElementById("logoutAiPageBtn");

      if (textarea) {
        const saved = localStorage.getItem(STORAGE_KEY);
        textarea.value = (saved && saved.trim()) ? saved : DEFAULT_TEXT;
      }

      saveBtn?.addEventListener("click", function () {
        const val = (textarea?.value || "").trim();
        if (!val) {
          if (statusEl) statusEl.textContent = "Escribe informaciÃ³n antes de guardar.";
          return;
        }
        localStorage.setItem(STORAGE_KEY, val);
        if (statusEl) statusEl.textContent = "Guardado (" + new Date().toLocaleTimeString() + ")";
      });

      resetBtn?.addEventListener("click", function () {
        if (textarea) textarea.value = DEFAULT_TEXT;
        localStorage.setItem(STORAGE_KEY, DEFAULT_TEXT);
        if (statusEl) statusEl.textContent = "Texto base restaurado";
      });

      logoutBtn?.addEventListener("click", function () {
        try {
          localStorage.removeItem("darecore_admin_auth");
          sessionStorage.removeItem("darecore_admin_auth");
        } catch (e) {}
        window.location.href = "index.html";
      });
    })();
  </script>
<script id="dcAdminLogoLinkFix">
(function () {
  function wireAdminLogo() {
    const candidates = Array.from(document.querySelectorAll("header a, header button, header div, header span"));
    for (const el of candidates) {
      const text = (el.textContent || "").replace(/\s+/g, " ").trim().toUpperCase();
      if (text === "DARECORE ADMIN" || text === "DARE CORE ADMIN") {
        const target = el.tagName === "A" ? el : (el.closest("a") || el);
        if (target && target.tagName === "A") {
          target.setAttribute("href", "admin.html");
          target.removeAttribute("target");
        }
        if (target && !target.dataset.dcAdminHomeWired) {
          target.dataset.dcAdminHomeWired = "1";
          target.addEventListener("click", function (e) {
            if (document.body.classList.contains("dc-ai-view-active")) {
              e.preventDefault();
              e.stopPropagation();
              document.body.classList.remove("dc-ai-view-active");
              const sec = document.getElementById("darecoreAiKnowledgeAdmin");
              if (sec) sec.style.display = "none";
              window.scrollTo({ top: 0, behavior: "instant" });
              return false;
            }
            if (target.tagName !== "A") {
              e.preventDefault();
              window.location.href = "admin.html";
            }
          }, true);
        }
        break;
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", wireAdminLogo);
  } else {
    wireAdminLogo();
  }
  setTimeout(wireAdminLogo, 150);
})();
</script>
<script id="dcAiVoiceDictationScript">
(function () {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  const GEMINI_MIC_SVG = `
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="2" width="6" height="12" rx="3"></rect>
      <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
      <line x1="12" y1="18" x2="12" y2="22"></line>
    </svg>
  `;

  function findAiTextarea() {
    return (
      document.getElementById("darecoreAiKbTextarea") ||
      document.querySelector('textarea[id*="AiKb" i], textarea[id*="ai" i]')
    );
  }

  function findActionRow(textarea) {
    const saveBtn =
      document.getElementById("saveDarecoreAiKbBtn") ||
      Array.from(document.querySelectorAll("button")).find(b =>
        (b.textContent || "").toLowerCase().includes("guardar informaciÃ³n")
      );
    if (saveBtn && saveBtn.parentElement) return saveBtn.parentElement;
    return textarea ? textarea.parentElement : null;
  }

  function mountGeminiMic() {
    const textarea = findAiTextarea();
    if (!textarea) return;
    const row = findActionRow(textarea);
    if (!row) return;
    if (document.getElementById("dcAiMicDictateBtn")) return;

    const micBtn = document.createElement("button");
    micBtn.type = "button";
    micBtn.id = "dcAiMicDictateBtn";
    micBtn.setAttribute("aria-label", "MicrÃ³fono");
    micBtn.title = "MicrÃ³fono";
    micBtn.innerHTML = GEMINI_MIC_SVG;

    const applyIdleStyle = () => {
      micBtn.style.setProperty("width", "42px", "important");
      micBtn.style.setProperty("height", "42px", "important");
      micBtn.style.setProperty("min-width", "42px", "important");
      micBtn.style.setProperty("padding", "0", "important");
      micBtn.style.setProperty("border-radius", "999px", "important");
      micBtn.style.setProperty("background", "#ffffff", "important");
      micBtn.style.setProperty("background-color", "#ffffff", "important");
      micBtn.style.setProperty("color", "#111115", "important");
      micBtn.style.setProperty("border", "1.5px solid rgba(17, 17, 21, 0.16)", "important");
      micBtn.style.setProperty("box-shadow", "0 2px 8px rgba(0, 0, 0, 0.08)", "important");
      micBtn.style.setProperty("display", "inline-flex", "important");
      micBtn.style.setProperty("align-items", "center", "important");
      micBtn.style.setProperty("justify-content", "center", "important");
      micBtn.style.setProperty("cursor", "pointer", "important");
    };

    const applyActiveStyle = () => {
      micBtn.style.setProperty("width", "42px", "important");
      micBtn.style.setProperty("height", "42px", "important");
      micBtn.style.setProperty("min-width", "42px", "important");
      micBtn.style.setProperty("padding", "0", "important");
      micBtn.style.setProperty("border-radius", "999px", "important");
      micBtn.style.setProperty("background", "#ff2a00", "important");
      micBtn.style.setProperty("background-color", "#ff2a00", "important");
      micBtn.style.setProperty("color", "#ffffff", "important");
      micBtn.style.setProperty("border", "1.5px solid #ff2a00", "important");
      micBtn.style.setProperty("box-shadow", "0 0 0 4px rgba(255, 42, 0, 0.22), 0 0 18px rgba(255, 42, 0, 0.7)", "important");
      micBtn.style.setProperty("display", "inline-flex", "important");
      micBtn.style.setProperty("align-items", "center", "important");
      micBtn.style.setProperty("justify-content", "center", "important");
      micBtn.style.setProperty("cursor", "pointer", "important");
    };

    applyIdleStyle();

    const statusEl =
      document.getElementById("darecoreAiKbStatus") ||
      document.querySelector('[id*="AiKbStatus" i], [id*="aiKbStatus" i]');

    if (!SpeechRecognition) {
      micBtn.disabled = true;
      micBtn.style.setProperty("opacity", "0.45", "important");
      row.appendChild(micBtn);
      return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "es-MX";
    recognition.continuous = true;
    recognition.interimResults = true;

    let listening = false;
    let baseText = "";

    function setListeningState(active) {
      listening = active;
      if (active) {
        applyActiveStyle();
        if (statusEl) statusEl.textContent = "Escuchando...";
      } else {
        applyIdleStyle();
        if (statusEl && statusEl.textContent === "Escuchando...") {
          statusEl.textContent = "Dictado listo";
        }
      }
    }

    recognition.onresult = function (event) {
      let finalTranscript = "";
      let interimTranscript = "";
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript || "";
        if (event.results[i].isFinal) {
          finalTranscript += transcript;
        } else {
          interimTranscript += transcript;
        }
      }
      if (finalTranscript) {
        const sep = baseText && !/\s$/.test(baseText) ? " " : "";
        baseText = baseText + sep + finalTranscript.trim();
      }
      const livePiece = interimTranscript.trim();
      const joiner = (baseText && livePiece && !/\s$/.test(baseText)) ? " " : "";
      textarea.value = baseText + joiner + livePiece;
      textarea.dispatchEvent(new Event("input", { bubbles: true }));
    };

    recognition.onerror = function (ev) {
      setListeningState(false);
      if (statusEl) {
        statusEl.textContent = "MicrÃ³fono: " + (ev.error || "error");
      }
    };

    recognition.onend = function () {
      if (listening) {
        try {
          recognition.start();
        } catch (e) {
          setListeningState(false);
        }
      } else {
        setListeningState(false);
      }
    };

    micBtn.addEventListener("click", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      if (!listening) {
        baseText = textarea.value || "";
        setListeningState(true);
        try {
          recognition.start();
        } catch (e) {
          setListeningState(false);
        }
      } else {
        setListeningState(false);
        try {
          recognition.stop();
        } catch (e) {}
      }
    });

    row.appendChild(micBtn);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", mountGeminiMic);
  } else {
    mountGeminiMic();
  }
  setInterval(mountGeminiMic, 500);
})();
</script>
